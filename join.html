<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Get Involved | Men's Gymnastics</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header>
    <p>Men's Gymnastics</p>
    <nav>
      <ul>
        <li><a href="index.html">Home</a></li>
        <li><a href="rules.html">Rules &amp; Levels</a></li>
        <li><a href="events.html">Events</a></li>
        <li><a href="scoring.html">Scoring</a></li>
        <li><a href="join.html" aria-current="page">Get Involved</a></li>
      </ul>
    </nav>
  </header>

  <main>
    <h1>Get Involved</h1>

    <section class="box">
      <h2>Contact Us</h2>
      <form>
        <label for="name">Name</label>
        <input type="text" id="name" name="name" required>

        <label for="email">Email</label>
        <input type="email" id="email" name="email" required>

        <label for="message">Message</label>
        <textarea id="message" name="message" rows="4" required></textarea>

        <button type="submit">Send</button>
      </form>
    </section>

    <section class="box">
      <h2>Helpful Links</h2>
      <ul>
        <li><a href="https://usagym.org">USA Gymnastics</a></li>
      </ul>
    </section>
  </main>

  <footer>
    <p>Made by Ryan Jackson</p>
  </footer>
</body>
</html>
